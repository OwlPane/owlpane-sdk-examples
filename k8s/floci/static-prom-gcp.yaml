apiVersion: v1
kind: ConfigMap
metadata:
  name: static-prom-gcp
  labels:
    app: static-prom-gcp
data:
  metrics.prom: |
    # TYPE gcp_compute_instance_cpu_utilization gauge
    gcp_compute_instance_cpu_utilization 0.34
    # TYPE gcp_compute_instance_memory_utilization gauge
    gcp_compute_instance_memory_utilization 0.52
    # TYPE gcp_loadbalancing_request_count counter
    gcp_loadbalancing_request_count 2048
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: static-prom-gcp
  labels:
    app: static-prom-gcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: static-prom-gcp
  template:
    metadata:
      labels:
        app: static-prom-gcp
    spec:
      containers:
        - name: exporter
          image: prom/node-exporter:v1.8.2
          args:
            - --web.listen-address=:8080
            - --path.rootfs=/host
            - --collector.textfile.directory=/textfile
            - --collector.textfile
            - --no-collector.wifi
            - --no-collector.hwmon
            - --no-collector.arp
            - --no-collector.bcache
            - --no-collector.bonding
            - --no-collector.conntrack
            - --no-collector.cpu
            - --no-collector.diskstats
            - --no-collector.edac
            - --no-collector.entropy
            - --no-collector.filefd
            - --no-collector.filesystem
            - --no-collector.infiniband
            - --no-collector.ipvs
            - --no-collector.loadavg
            - --no-collector.mdadm
            - --no-collector.meminfo
            - --no-collector.netclass
            - --no-collector.netdev
            - --no-collector.netstat
            - --no-collector.nfs
            - --no-collector.nfsd
            - --no-collector.pressure
            - --no-collector.rapl
            - --no-collector.schedstat
            - --no-collector.sockstat
            - --no-collector.softnet
            - --no-collector.stat
            - --no-collector.systemd
            - --no-collector.tapestats
            - --no-collector.thermal_zone
            - --no-collector.time
            - --no-collector.timex
            - --no-collector.udp_queues
            - --no-collector.uname
            - --no-collector.vmstat
            - --no-collector.xfs
            - --no-collector.zfs
          ports:
            - containerPort: 8080
              name: metrics
          volumeMounts:
            - name: textfile
              mountPath: /textfile
              readOnly: true
            - name: host
              mountPath: /host
              readOnly: true
      volumes:
        - name: textfile
          configMap:
            name: static-prom-gcp
        - name: host
          hostPath:
            path: /
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: static-prom-gcp
  labels:
    app: static-prom-gcp
spec:
  selector:
    app: static-prom-gcp
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080
