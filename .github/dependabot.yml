# Dependency update PRs. Security updates are separate and enabled in repository settings.
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  groups:
    actions:
      patterns:
      - '*'
- package-ecosystem: bundler
  directory: /apps/ruby
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  groups:
    minor-and-patch:
      update-types:
      - minor
      - patch
