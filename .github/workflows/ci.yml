name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, linux, local]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check actions are pinned to commit SHAs
        run: bash scripts/check-pinned-actions.sh
      - name: Secret scan (current tree)
        run: |
          cd /tmp
          curl -fsSL -o gitleaks_8.28.0_linux_x64.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks_8.28.0_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.28.0_linux_x64.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          /tmp/gitleaks detect --no-git --source . --config .gitleaks.toml --redact --no-banner
      - name: Validate k8s / dogfood manifest
        run: |
          chmod +x scripts/validate-k8s-config.sh
          ./scripts/validate-k8s-config.sh
