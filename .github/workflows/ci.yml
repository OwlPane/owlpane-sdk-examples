name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Secret scan (current tree)
        run: |
          cd /tmp
          curl -fsSL -o gitleaks_8.28.0_linux_x64.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks_8.28.0_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.28.0_linux_x64.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          /tmp/gitleaks detect --no-git --source . --config .gitleaks.toml --redact --no-banner
      - name: Validate k8s / dogfood manifest
        run: |
          chmod +x scripts/validate-k8s-config.sh
          ./scripts/validate-k8s-config.sh
