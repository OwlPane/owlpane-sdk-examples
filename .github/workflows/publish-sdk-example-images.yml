# GHCR packages sdk-example-* are linked to OwlPane/owlpane-sdk (not this repo).
# Docker build + push: OwlPane/owlpane-sdk → Publish SDK example images workflow.
name: Publish SDK example images (delegate)

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "docker/**"
      - "pii-canary/**"
      - "sdk-published.version"
      - "dogfood.manifest.json"
      - "_lib/**"
      - ".github/workflows/publish-sdk-example-images.yml"
  workflow_dispatch:
    inputs:
      sdk_version:
        description: Published @owlpane/node version (default sdk-published.version)
        required: false
      wait_for_registries:
        description: Wait for npm/PyPI before building (after sdk-v* release)
        type: boolean
        default: false
  repository_dispatch:
    types: [sdk-published]

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      sdk_version: ${{ steps.meta.outputs.sdk_version }}
      examples_ref: ${{ steps.meta.outputs.examples_ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - id: meta
        run: |
          SDK_VERSION="${{ github.event.inputs.sdk_version }}"
          if [ -z "$SDK_VERSION" ] && [ -n "${{ github.event.client_payload.sdk_version }}" ]; then
            SDK_VERSION="${{ github.event.client_payload.sdk_version }}"
          fi
          if [ -z "$SDK_VERSION" ]; then
            SDK_VERSION="$(tr -d ' \n\r' < sdk-published.version)"
          fi
          echo "sdk_version=$SDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "examples_ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  trigger-sdk-publish:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - name: Trigger OwlPane/owlpane-sdk GHCR publish
        env:
          GH_TOKEN: ${{ secrets.SDK_PUBLISH_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::GHCR push runs from OwlPane/owlpane-sdk (packages linked there)."
            echo "::notice::Set repo secret SDK_PUBLISH_DISPATCH_TOKEN (PAT: workflow on owlpane-sdk) or run:"
            echo "  gh workflow run publish-sdk-example-images.yml -R OwlPane/owlpane-sdk -f sdk_version=${{ needs.meta.outputs.sdk_version }} -f wait_for_registries=true -f examples_ref=main"
            exit 0
          fi
          REF="${{ needs.meta.outputs.examples_ref }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            REF="main"
          fi
          gh workflow run publish-sdk-example-images.yml -R OwlPane/owlpane-sdk \
            -f "sdk_version=${{ needs.meta.outputs.sdk_version }}" \
            -f "wait_for_registries=${{ github.event.inputs.wait_for_registries || 'true' }}" \
            -f "examples_ref=${REF}"
