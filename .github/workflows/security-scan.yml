name: security-scan

# Secret scanning, static analysis and dependency review. Evidence for ISO 27001 A.8.8/A.8.28,
# SOC 2 CC7.1/CC8.1 and DORA Art. 9(4)(f): runs on every PR, on the integration branches, and weekly.
on:
  merge_group:
  pull_request:
  push:
    branches: [main, dev]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ${{ fromJSON((github.base_ref == 'main' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/') || github.ref_type == 'tag') && (vars.CI_RUNS_ON_MAIN || '["self-hosted","linux","aws"]') || (vars.CI_RUNS_ON || '["self-hosted","linux","aws"]')) }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum-verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
      - name: Scan history
        run: ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose --no-banner --exit-code 1

  codeql:
    name: CodeQL (${{ matrix.language }})
    # Code scanning on private repositories needs GitHub Advanced Security; set repo variable GHAS_ENABLED=true.
    if: ${{ !github.event.repository.private || vars.GHAS_ENABLED == 'true' }}
    runs-on: ${{ fromJSON((github.base_ref == 'main' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/') || github.ref_type == 'tag') && (vars.CI_RUNS_ON_MAIN || '["self-hosted","linux","aws"]') || (vars.CI_RUNS_ON || '["self-hosted","linux","aws"]')) }}
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ["actions"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          category: "/language:${{ matrix.language }}"

  dependency-review:
    name: Dependency review
    # Needs the repository's Dependency graph enabled (Settings > Security); set repo variable
    # DEPENDENCY_REVIEW_ENABLED=true once it is, plus GHAS_ENABLED=true on private repositories.
    if: ${{ github.event_name == 'pull_request' && vars.DEPENDENCY_REVIEW_ENABLED == 'true' && (!github.event.repository.private || vars.GHAS_ENABLED == 'true') }}
    runs-on: ${{ fromJSON((github.base_ref == 'main' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/') || github.ref_type == 'tag') && (vars.CI_RUNS_ON_MAIN || '["self-hosted","linux","aws"]') || (vars.CI_RUNS_ON || '["self-hosted","linux","aws"]')) }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec  # v5.0.1
        with:
          fail-on-severity: high
