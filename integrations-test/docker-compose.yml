# Local End-to-End Integration Test Stack (Zero Cloud Accounts Required)
# Boots Postgres, MySQL, MongoDB, Redis, Kafka (KRaft), RabbitMQ, NGINX (stub_status),
# Mailpit (SMTP), Grafana (provisioned against Owlpane PromQL API), and OTel Collector Contrib.
#
# Usage:
#   export OWLPANE_INGEST_URL=http://host.docker.internal:4318
#   export OWLPANE_INGEST_KEY=owl_ing_...
#   export OWLPANE_API_URL=http://host.docker.internal:4100
#   export OWLPANE_TOKEN=owl_pat_...
#   docker compose -f integrations-test/docker-compose.yml up -d
#   node integrations-test/test-all-integrations.mjs

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: owlpane
      POSTGRES_PASSWORD: owlpane-test-password
      POSTGRES_DB: owlpane_test
    ports: ["15432:5432"]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: owlpane-test-password
      MYSQL_DATABASE: owlpane_test
    ports: ["13306:3306"]

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: owlpane
      MONGO_INITDB_ROOT_PASSWORD: owlpane-test-password
    ports: ["17017:27017"]

  redis:
    image: redis:7-alpine
    ports: ["16379:6379"]

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: owlpane
      RABBITMQ_DEFAULT_PASS: owlpane-test-password
    ports: ["15672:15672", "15671:5672"]

  kafka:
    image: apache/kafka:3.8.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports: ["19092:9092"]

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["18080:80"]

  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["1025:1025", "8025:8025"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      OWLPANE_INGEST_URL: ${OWLPANE_INGEST_URL:-http://host.docker.internal:4318}
      OWLPANE_INGEST_KEY: ${OWLPANE_INGEST_KEY:-owl_ing_replace_me}
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [postgres, mysql, mongodb, redis, rabbitmq, kafka, nginx]

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      OWLPANE_API_URL: ${OWLPANE_API_URL:-http://host.docker.internal:4100}
      OWLPANE_TOKEN: ${OWLPANE_TOKEN:-owl_pat_replace_me}
    volumes:
      - ./grafana-datasource.yaml:/etc/grafana/provisioning/datasources/owlpane.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports: ["13000:3000"]
