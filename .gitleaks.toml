# Extends the default ruleset; only documented placeholder values are allowlisted.
title = "OwlPane gitleaks"

[extend]
useDefault = true

[allowlist]
description = "Placeholder keys used in examples and tests"
regexes = [
  '''AKIAIOSFODNN7EXAMPLE''',
  '''owl_ing_0{8,}''',
]
paths = [
  '''(^|/)package-lock\.json$''',
  '''(^|/)pnpm-lock\.yaml$''',
]
